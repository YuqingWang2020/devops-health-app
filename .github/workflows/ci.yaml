name: CI - Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/health-api:${{ github.sha }} \
          -t ${{ secrets.DOCKER_USERNAME }}/health-api:latest \
          ./app

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/health-api:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/health-api:latest

