name: CI
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/health-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/health-api:latest

      #
      - name: Update Deployment.yaml with new image tag
        run: |
          sed -i "s|image: .*health-api:.*|image: ${{ secrets.DOCKER_USERNAME }}/health-api:${{ github.sha }}|" \
            k8s/Deployment.yaml

      - name: Commit and push updated Deployment.yaml
        run: |
          git config user.email "ci-bot@github.com"
          git config user.name "GitHub Actions"
          git add k8s/Deployment.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          git push
