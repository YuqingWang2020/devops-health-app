apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: health-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YuqingWang2020/devops-health-app.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

