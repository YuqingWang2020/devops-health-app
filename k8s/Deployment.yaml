apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-api
  template:
    metadata:
      labels:
        app: health-api
    spec:
      containers:
      - name: health-api
        image: yuqingwang2020/health-api:0fcd9af9ab7060dbc0fbabfdb7fd5931217a6b43
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          - name: APP_ENV
            valueFrom:
              configMapKeyRef:
                name: health-config
                key: APP_ENV
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: health-config
                key: LOG_LEVEL
          - name: API_TOKEN 
            valueFrom:
              secretKeyRef:
                name: health-secret
                key: API_TOKEN
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
